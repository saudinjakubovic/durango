<!doctype html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>V8 Sniper Fuzzer</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: monospace; padding: 20px; }
        h1 { color: #fff; text-shadow: 0 0 8px #00ffcc; }
        #status { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ff0; }
        #logs { background: #000; border: 1px solid #00ffcc; height: 65vh; overflow-y: auto; padding: 10px; font-size: 14px; }
        .crash { color: #f00; font-weight: bold; background: #300; padding: 5px; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px 25px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <h1>V8 SNIPER FUZZER</h1>
    <button onclick="startFuzz()">POKRENI SNIPER</button>
    <div id="status">Status: Čeka...</div>
    <div id="logs"></div>

    <script>
        const logEl = document.getElementById('logs');
        const statusEl = document.getElementById('status');
        let isRunning = false;
        let testId = parseInt(localStorage.getItem('sniper_id') || '0');

        function log(msg, isCrash = false) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (isCrash) div.className = 'crash';
            logEl.prepend(div);
        }

        const crashedId = localStorage.getItem('sniper_crash');
        if (crashedId) {
            log(`!!! CRASH NA TESTU ID: ${crashedId} !!!`, true);
            log(`V8 je pao! Ovo je pravi bug, spremi ovaj ID!`, true);
            localStorage.removeItem('sniper_crash');
        } else {
            log(`Sniper spreman. ID: ${testId}`);
        }

        function generateSniperPayload() {
            let trapType = Math.floor(Math.random() * 4);
            let proxyCode = "";
            
            // Proxy zamke su pozivale UAF u V8
            if (trapType === 0) {
                proxyCode = `
                    let target = { a: 1, b: 2 };
                    let handler = {
                        get: function(t, p) { delete t.a; return 999; },
                        deleteProperty: function(t, p) { t.a = 1; return true; }
                    };
                    let p = new Proxy(target, handler);
                    for(let i=0; i<10000; i++) { let x = p.a; delete p.a; }
                `;
            } 
            // Array Sort sa custom comparatorom (istorijski V8 bugovi)
            else if (trapType === 1) {
                proxyCode = `
                    let arr = [];
                    for(let i=0; i<1000; i++) { arr.push({ val: i }); }
                    arr.sort(function(a, b) {
                        if(a.val > 500) { arr.length = 0; } // DETONATOR
                        return a.val - b.val;
                    });
                `;
            }
            // RegExp compilation (moze da izazove OOM ili heap corruption)
            else if (trapType === 2) {
                proxyCode = `
                    let pattern = "(".repeat(1000) + ")".repeat(1000);
                    let re = new RegExp(pattern);
                    re.test("aaaaaaaaaaaaaaaaaaaaaaaaaaaa");
                `;
            }
            // WASM Memory.grow detachment
            else {
                proxyCode = `
                    let bytes = new Uint8Array([0,97,115,109,1,0,0,0,5,3,1,0,1]);
                    let mod = new WebAssembly.Module(bytes);
                    let inst = new WebAssembly.Instance(mod);
                    let mem = inst.exports.memory;
                    if(mem) { mem.grow(10000); mem.grow(0); }
                `;
            }

            return `
                try {
                    // JIT optimizacija zagrijavanje
                    function dummy(a, b) { return a + b; }
                    for(let i=0; i<20000; i++) dummy(i, i+1);

                    // Pucanje
                    ${proxyCode}

                } catch(e) {}
            `;
        }

        function startFuzz() {
            if (isRunning) return;
            isRunning = true;
            statusEl.textContent = "Status: SNIPER AKTIVAN...";
            log("Kreće precizno gađanje V8...");

            function loop() {
                if (!isRunning) return;
                
                testId++;
                localStorage.setItem('sniper_id', testId);
                localStorage.setItem('sniper_crash', testId);

                if (testId % 10 === 0) {
                    log(`Test ID: ${testId} - Gađam V8...`);
                }

                let js = generateSniperPayload();
                
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                try {
                    let doc = iframe.contentWindow.document;
                    let script = doc.createElement('script');
                    script.textContent = js;
                    doc.body.appendChild(script);
                } catch(e) {}

                setTimeout(() => {
                    if (localStorage.getItem('sniper_crash') == testId) {
                        localStorage.removeItem('sniper_crash');
                    }
                    if (iframe.parentNode) {
                        document.body.removeChild(iframe);
                    }
                    loop();
                }, 150); 
            }

            loop();
        }
    </script>
</body>
</html>
